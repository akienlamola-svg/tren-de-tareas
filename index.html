<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tren de Tareas">
<meta name="theme-color" content="#F2F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1520" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<title>Tren de Tareas</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<style>
/* Layout: app de una columna (máx. 640px), cabecera tipo panel de estación, pestañas fijas abajo.
   Ilustraciones en «línea clara»: contorno negro uniforme, color plano, sin sombras. */
:root{
  --bg:#F1F4F7; --surface:#FFFFFF; --ink:#16202C; --muted:#56657A; --line:#D3DCE6; --rail:#7B6A5B;
  --school:#2F5FA8; --home:#2E7D72; --social:#A8476B;
  --f1:#2F8A4C; --f2:#C08A12; --f3:#D2661B; --f4:#C83232; --f5:#6B4FB3;
  --ok:#2F8A4C; --on-accent:#FFFFFF; --medal:#E9EEF4;
  --font-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151E; --surface:#17212D; --ink:#E9EEF4; --muted:#9AA8B8; --line:#2B3949; --rail:#9A8878;
  --school:#7EA6E0; --home:#5FBFB0; --social:#DB8AAA;
  --f1:#5CC27C; --f2:#E7B43C; --f3:#F08A45; --f4:#EE6E6E; --f5:#A891EA;
  --ok:#2F8A4C; --on-accent:#0E151E; --medal:#E2E8EF; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E151E; --surface:#17212D; --ink:#E9EEF4; --muted:#9AA8B8; --line:#2B3949; --rail:#9A8878;
  --school:#7EA6E0; --home:#5FBFB0; --social:#DB8AAA;
  --f1:#5CC27C; --f2:#E7B43C; --f3:#F08A45; --f4:#EE6E6E; --f5:#A891EA;
  --ok:#2F8A4C; --on-accent:#0E151E; --medal:#E2E8EF; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--school);outline-offset:2px}
[hidden]{display:none!important}
.ico{width:1em;height:1em;flex:none;vertical-align:-.15em}
.retrato{display:block;aspect-ratio:1;max-width:100%;height:auto;border-radius:50%;object-fit:cover;border:3px solid #1C1C1C;background:var(--medal)}
.tren-svg{display:block;width:100%;height:auto}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 10px;border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.top h1{font-family:var(--font-display);font-weight:700;font-size:32px;line-height:1.05;margin:0;letter-spacing:.2px;text-wrap:balance;display:flex;align-items:center;gap:10px}
.top h1 .ico{font-size:28px}
.top .sub{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:3px}
.top .grow{flex:1;min-width:0}
.icon-btn{border:2px solid var(--line);background:var(--surface);border-radius:12px;min-width:46px;height:46px;padding:0 12px;font-size:22px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.icon-btn.txt{font-size:16px;font-weight:700}
.icon-btn.txt .ico{font-size:20px}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(110px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{border:0;background:none;border-radius:12px;padding:7px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:700;color:var(--muted)}
.tab .ico{font-size:26px}
.tab[aria-current="page"]{color:var(--tabc,var(--ink));background:color-mix(in srgb,var(--tabc,var(--ink)) 12%,transparent)}

/* Tarjeta de tarea */
.card{--fc:var(--f1);background:color-mix(in srgb,var(--fc) 8%,var(--surface));border:2.5px solid var(--fc);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;gap:14px;align-items:flex-start}
.badge{flex:none;width:76px;height:76px;border-radius:50%;background:var(--medal);border:2.5px solid var(--fc);display:grid;place-items:center;padding:8px;color:var(--fc)}
.card-t{min-width:0;flex:1}
.fase{font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fc)}
.titulo{font-size:21px;font-weight:700;line-height:1.25;margin:2px 0;overflow-wrap:anywhere}
.lugar{font-size:15px;color:var(--muted);display:flex;align-items:center;gap:6px}
.chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1.5px dashed var(--muted);color:var(--muted);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.msg{font-size:16px;margin:0}

.via{position:relative;height:48px}
.via .rail{position:absolute;left:0;right:0;bottom:6px;height:12px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--rail) 0 5px,transparent 5px 14px)}
.via .tramos{position:absolute;left:0;right:0;bottom:10px;height:4px;display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.via .tramos i{display:block;border-radius:2px}
.via .tren{position:absolute;bottom:12px;width:58px;transform:translateX(-50%);transition:left .6s ease;color:var(--fc)}
.via .meta{position:absolute;right:0;bottom:16px;font-size:26px;color:var(--ink);display:flex}

.card-f{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.quedan{flex:1;min-width:150px}
.quedan b{display:block;font-size:19px}
.quedan span{font-size:14px;color:var(--muted)}
.btn{border:0;border-radius:14px;padding:14px 20px;font-weight:700;font-size:18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn .ico{font-size:22px}
.btn-ok{background:var(--ok);color:#fff;font-size:19px;padding:14px 22px}
.btn-main{width:100%;background:var(--ac,var(--school));color:var(--on-accent);font-size:20px;padding:18px}
.btn-main:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:transparent;border:2px solid var(--line);font-size:15px;padding:8px 14px;border-radius:10px;display:inline-flex;align-items:center;gap:6px}
.btn-ghost .ico{font-size:18px}
.btn-danger{background:var(--f4);color:#fff;font-size:15px;padding:8px 14px;border-radius:10px;border:0}
.mini{display:flex;gap:8px;flex-wrap:wrap}
.proxima{display:flex;gap:8px;align-items:flex-start;font-size:16px;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--fc) 12%,var(--surface))}
.proxima .ico{font-size:20px;margin-top:1px;color:var(--fc)}
.hitos{display:flex;flex-direction:column;gap:6px}
.hitos ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.hitos li{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
.hitos li .ico{font-size:18px}
.hitos li.hecho span{text-decoration:line-through}
.hitos li.hecho .ico{color:var(--ok)}
.hitos li.actual{color:var(--ink);font-weight:700}
.hitos li span{flex:1;min-width:0;overflow-wrap:anywhere}
.mini-link{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:14px;padding:4px}
.nota{margin:0;color:var(--muted);font-size:17px}
.opciones{display:flex;flex-direction:column;gap:12px}
.btn-ghost.grande{font-size:19px;padding:16px;border-radius:14px;justify-content:center;width:100%}
.lista-p{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lista-p li{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.lista-p li .ico{font-size:22px;color:var(--ac)}
.lista-p li span{flex:1;min-width:0;overflow-wrap:anywhere;font-size:16px}
.lista-p li.final{border-style:dashed}
.cita{display:flex;gap:14px;align-items:center;border-color:var(--ac);background:color-mix(in srgb,var(--ac) 9%,var(--surface))}
.cita h2{font-family:var(--font-display);font-weight:700;font-size:23px;margin:2px 0}
.cita p{margin:0;color:var(--muted)}
.cita .l{color:var(--ac)}
.rep .rec{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.rep .rec span{color:var(--muted);font-size:15px}
.rep .rec .prox{color:var(--ink);font-weight:700}
.rep .rec .mini{margin-top:6px}
input[type=date]{width:100%;font:inherit;font-size:20px;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.confirma{background:var(--surface);border:2px solid var(--ok);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.confirma p{margin:0;font-size:19px;font-weight:700}
.confirma .btn-ghost{font-size:17px;padding:12px 18px}

.panel{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px}
.premio{display:flex;gap:16px;align-items:center;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--surface))}
.premio h2,.aviso h2,.sec h2{font-family:var(--font-display);font-weight:700;font-size:23px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.premio ul,.aviso ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.premio li,.aviso li{display:flex;align-items:center;gap:8px}
.premio li{align-items:flex-start}
.premio li .ico{color:var(--ok);font-size:20px;margin-top:2px}
.aviso li .mini-tren{width:40px;flex:none}
.premio .retrato{flex:none;width:96px}
.aviso{border-color:var(--f3);background:color-mix(in srgb,var(--f3) 8%,var(--surface));display:flex;flex-direction:column;gap:10px}
.ejemplos{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:15px;color:var(--muted);border-style:dashed}
.vacio{text-align:center;padding:40px 12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.vacio .ico{font-size:64px;color:var(--muted)}
.vacio h2{font-family:var(--font-display);font-weight:700;font-size:25px;margin:0}
.vacio p{margin:0;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tile{position:relative;background:var(--surface);border:2.5px solid var(--ac);border-radius:var(--r);padding:16px 10px;min-height:156px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.disco{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 14%,var(--surface));color:var(--ac);font-size:34px}
.tile .n{font-weight:700;font-size:18px;line-height:1.2;overflow-wrap:anywhere}
.tile .c{font-size:15px;font-weight:700;border-radius:999px;padding:2px 10px 2px 4px;display:inline-flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--fc,var(--line)) 16%,transparent);color:var(--ink)}
.tile .c .mini-tren{width:34px;color:var(--fc)}
.tile .c.none{font-weight:400;color:var(--muted);background:none;padding:2px 10px}
.tile.add{border-style:dashed;color:var(--ac);font-weight:700}
.tile.add .ico{font-size:40px}
.tile .edit{position:absolute;inset:auto 8px 8px 8px;display:flex;gap:6px;justify-content:center}
.tile .edit button{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 0;font-size:14px;font-weight:700}
.tile.editing{padding-bottom:56px}
.tile .conf{position:absolute;inset:0;background:var(--surface);border-radius:calc(var(--r) - 3px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;font-size:15px}
.tile .abrir{position:absolute;inset:0;opacity:0;border:0}

details.hechas{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px}
details.hechas summary{font-weight:700;cursor:pointer}
.fila{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.fila:first-of-type{border-top:0}
.fila .ico{font-size:20px;color:var(--muted)}
.fila .ico.ok{color:var(--ok)}
.fila s{flex:1;min-width:0;color:var(--muted);overflow-wrap:anywhere}

.sheet-bg{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94%;overflow:auto;border-radius:20px 20px 0 0;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:14px calc(20px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:16px}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-top .donde{font-weight:700;color:var(--muted);min-width:0;overflow-wrap:anywhere;display:flex;align-items:center;gap:6px}
.pasos{display:flex;gap:6px}
.pasos i{width:28px;height:6px;border-radius:3px;background:var(--line)}
.pasos i.on{background:var(--ac,var(--school))}
.preg{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.1;margin:0;text-wrap:balance}
textarea,input[type=text],input[type=time],select{width:100%;font:inherit;font-size:20px;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px}
textarea{min-height:120px;resize:vertical}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pick button{border:2.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;font-weight:700;text-align:left}
.pick button .ico{font-size:26px;color:var(--ac)}
.pick h3{grid-column:1/-1;margin:6px 0 0;font-size:14px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);display:flex;align-items:center;gap:6px}

.cal{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h b{font-size:19px}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal-g .dow{font-size:13px;font-weight:700;color:var(--muted);padding:4px 0}
.cal-g button{border:0;background:none;border-radius:10px;aspect-ratio:1;max-width:100%;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.cal-g button:disabled{color:var(--line);cursor:default}
.cal-g button.hoy{outline:2px solid var(--line)}
.cal-g button.sel{background:var(--ac,var(--school));color:var(--on-accent)}
.horas{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.horas button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:700;font-variant-numeric:tabular-nums}
.horas button.sel{border-color:var(--ac,var(--school));background:color-mix(in srgb,var(--ac,var(--school)) 15%,var(--surface))}
.horas input{width:auto;flex:1;min-width:130px;padding:10px 12px;font-size:18px}
.resumen{font-size:17px;font-weight:700;margin:0;display:flex;gap:8px;align-items:flex-start}
.resumen .ico{font-size:22px;margin-top:1px}
.resumen.mal{color:var(--f4)}
.iconos{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.iconos button{border:2px solid transparent;background:var(--surface);border-radius:10px;font-size:28px;aspect-ratio:1;max-width:100%;display:grid;place-items:center;color:var(--ink)}
.iconos button.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,var(--surface));color:var(--ac)}
label.l,span.l{font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

.fiesta{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,var(--ok) 10%,var(--bg));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));overflow:auto}
.fiesta .retrato{width:min(220px,58vw);animation:aparece .5s ease-out both}
.fiesta .sello{font-family:var(--font-display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:15px;color:var(--ok);border:2px solid var(--ok);border-radius:999px;padding:4px 14px}
.fiesta h2{font-family:var(--font-display);font-weight:700;font-size:40px;margin:0}
.fiesta p{font-size:21px;margin:0;max-width:30ch;overflow-wrap:anywhere}
.fiesta .adel{color:var(--ok);font-weight:700}
.fiesta .btn-main{max-width:420px;background:var(--ok);color:#fff}
@keyframes aparece{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.fiesta .retrato{animation:none}.via .tren{transition:none}}

.sec{display:flex;flex-direction:column;gap:10px}
.sec p{margin:0}
.ok-msg{color:var(--ok);font-weight:700}
</style>
</head>
<body>


<header class="top"><div class="top-in" id="top"></div></header>
<main><div class="wrap" id="app"></div></main>
<nav class="tabs" aria-label="Secciones"><div class="tabs-in" id="tabs"></div></nav>
<div id="sheet"></div>
<div id="fiesta"></div>

<script>
(function(){
"use strict";
var KEY = "tren-de-tareas-v2";
var H = 3600e3, D = 24*H;

// ---------- Iconos de línea (trazo uniforme) ----------
var IC = {
  via:'<path d="M8 3 5 21M16 3l3 18"/><path d="M6.6 8h10.8M6 13h12M5.3 18h13.4"/>',
  birrete:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5"/><path d="M22 9v6"/>',
  casa:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  personas:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.8"/><path d="M16 14.2A5 5 0 0 1 21.5 19"/>',
  ajustes:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  mas:'<path d="M12 5v14M5 12h14"/>',
  atras:'<path d="M15 5l-7 7 7 7"/>',

// ---------- Lógica de las fases ----------
// Próximo hito: la primera entrega parcial pendiente o, si no queda ninguna, la entrega final.
function parcialesDe(t){ return (t.parciales || []).slice().sort(function(a,b){ return a.limite - b.limite; }); }
function objetivo(t){
  var ps = parcialesDe(t), inicio = t.creada;
  for (var i = 0; i < ps.length; i++){
    if (!ps[i].completada) return {inicio:inicio, limite:ps[i].limite, parcial:ps[i], n:i+1, de:ps.length};
    inicio = Math.min(ps[i].limite, t.limite - 60e3);
  }
  return {inicio:inicio, limite:t.limite, parcial:null};
}
function progreso(t, now){
  var o = objetivo(t), total = o.limite - o.inicio;
  if (total <= 0) return 1;
  return Math.min(1, Math.max(0, (now - o.inicio) / total));
}
function fase(t, now){
  now = now || Date.now();
  if (now >= objetivo(t).limite) return 5;
  var p = progreso(t, now);
  return p < .25 ? 1 : p < .5 ? 2 : p < .75 ? 3 : 4;
}
function aTiempo(t){ return t.completada != null && t.completada <= t.limite; }
function restante(t, now){
  var s = (objetivo(t).limite - now) / 1000;
  if (s <= 0) return "Fuera de plazo";
  var h = Math.floor(s/3600), d = Math.floor(h/24);
  if (d >= 2) return "Quedan " + d + " días";
  if (d === 1) { var r = h % 24; return r ? "Queda 1 día y " + r + " h" : "Queda 1 día"; }
  if (h >= 1) return h === 1 ? "Queda 1 hora" : "Quedan " + h + " horas";
  return "Quedan " + Math.max(1, Math.floor(s/60)) + " min";
}

function maquinistaSVG(){
  return '<img class="retrato" src="'+RETRATO+'" alt="El maquinista, sonriente, en la cabina del tren">';
}

// ---------- Vistas ----------
function tarjeta(t, now, conLugar){
  var f = fase(t, now), F_ = FASES[f], a = apartado(t.apartadoId), o = objetivo(t), ps = parcialesDe(t);
  var p = progreso(t, now) * 100;
  var tramos = [1,2,3,4].map(function(i){ return '<i style="background:'+FASES[i].c+'"></i>'; }).join("");
  var borrar = borrandoTarea === t.id
    ? '<button class="btn-danger" data-act="borrar-tarea-si" data-id="'+t.id+'">Sí, borrar</button><button class="btn-ghost" data-act="borrar-tarea-no">No</button>'
    : '<button class="btn-ghost" data-act="borrar-tarea" data-id="'+t.id+'">Borrar</button>';
  var cal = standalone && f < 5 ? '<button class="btn-ghost" data-act="ics" data-id="'+t.id+'">'+ico("campana")+' Avisos al calendario</button>' : '';
  return '<article class="card" style="--fc:'+F_.c+'">' +
    '<div class="card-h"><div class="badge">'+tren(f)+'</div><div class="card-t">' +
      '<div class="fase">'+F_.n+'</div>' +
      '<div class="titulo">'+esc(t.titulo)+(t.ejemplo ? '<span class="chip">Ejemplo</span>' : '')+'</div>' +
      (conLugar && a ? '<div class="lugar">'+ico(a.icono)+esc(a.nombre)+' · '+AREAS[a.area].t+'</div>' : '') +
    '</div></div>' +
    (o.parcial ? '<div class="proxima" style="--fc:'+F_.c+'">'+ico("meta")+'<span><b>Entrega parcial '+o.n+' de '+o.de+':</b> '+esc(o.parcial.titulo)+'</span></div>' : '') +
    '<div class="via" aria-hidden="true"><div class="rail"></div><div class="tramos">'+tramos+'</div>' +
      '<span class="meta">'+ico("meta")+'</span><span class="tren" style="left:clamp(29px,'+p.toFixed(1)+'%,calc(100% - 62px))">'+tren(f)+'</span></div>' +
    '<p class="msg">'+F_.m+'</p>' +
    (confirmandoHecho === t.id
      ? '<div class="confirma" role="group" aria-label="Confirmar"><p>'+(o.parcial ? '¿Estás seguro de que has acabado la entrega parcial «'+esc(o.parcial.titulo)+'»?' : '¿Estás seguro de que has acabado esta tarea?')+'</p><div class="mini"><button class="btn btn-ok" data-act="hecho" data-id="'+t.id+'">'+ico("check")+' Sí, acabada</button><button class="btn btn-ghost" data-act="hecho-no">Todavía no</button></div></div>'
      : '<div class="card-f"><div class="quedan"><b>'+restante(t, now)+'</b><span>'+(o.parcial?'Entrega parcial':'Entrega final')+': '+fmtLargo.format(new Date(o.limite))+'</span></div>' +
        '<button class="btn btn-ok" data-act="acabado" data-id="'+t.id+'">'+ico("check")+' Acabado</button></div>') +
    (ps.length ? '<div class="hitos"><span class="l">Entregas</span><ol>' + ps.map(function(p){
        return '<li class="'+(p.completada?'hecho':(p===o.parcial?'actual':''))+'">'+ico(p.completada?'checkc':'reloj')+'<span>'+esc(p.titulo)+' · '+fmtCorto.format(new Date(p.limite))+'</span>' +
          (p.completada ? '<button class="mini-link" data-act="parcial-deshacer" data-id="'+t.id+'" data-p="'+p.id+'">Deshacer</button>' : '') + '</li>'; }).join("") +
        '<li class="'+(o.parcial?'':'actual')+'">'+ico('meta')+'<span>Entrega final · '+fmtCorto.format(new Date(t.limite))+'</span></li></ol></div>' : '') +
    '<div class="mini">'+cal+borrar+'</div>' +
  '</article>';
}

function vistaInicio(now){
  var html = "";
  var desde = now - S.diasPremio * D;
  var premios = S.tareas.filter(function(t){ return aTiempo(t) && t.completada > desde; }).sort(function(a,b){ return b.completada - a.completada; });
  var pend = S.tareas.filter(function(t){ return !t.completada; }).sort(function(a,b){
    var fa = fase(a, now), fb = fase(b, now); return fa !== fb ? fb - fa : objetivo(a).limite - objetivo(b).limite; });
  var cambios = pend.filter(function(t){ return fase(t, now) > (S.vistos[t.id] || 1); });
  S.recurrentes.filter(enAviso).forEach(function(r){
    var c = proximaCita(r), a = apartado(r.apartadoId), ac = a ? AREAS[a.area].c : "var(--ink)";
    html += '<section class="panel cita" style="--ac:'+ac+'"><span class="disco">'+ico(a ? a.icono : "calendario")+'</span><div><span class="l">'+cuandoCita(c)+'</span><h2>'+esc(r.titulo)+'</h2><p>'+textoRepite(r).split(" · ")[0]+'</p></div></section>';
  });

  if (cambios.length){
    html += '<section class="panel aviso" aria-live="polite"><h2>'+ico("campana")+' Cambio de tren</h2><ul>' +
      cambios.map(function(t){ var f = fase(t, now); return '<li style="--fc:'+FASES[f].c+'"><span class="mini-tren" style="color:'+FASES[f].c+'">'+tren(f)+'</span><span><b>'+esc(t.titulo)+'</b> ya va en '+FASES[f].n+'</span></li>'; }).join("") +
      '</ul><button class="btn btn-ghost" data-act="vistos">Entendido</button></section>';
  }
  if (premios.length){
    html += '<section class="panel premio">'+maquinistaSVG()+'<div><h2>Buen trabajo, maquinista</h2><ul>' +
      premios.slice(0,3).map(function(t){ return '<li>'+ico("check")+'<span>'+esc(t.titulo)+'</span></li>'; }).join("") +
      (premios.length > 3 ? '<li>y '+(premios.length-3)+' más</li>' : '') + '</ul></div></section>';
  }
  if (S.tareas.some(function(t){ return t.ejemplo; })){
    html += '<div class="panel ejemplos"><span>Las tareas marcadas «Ejemplo» sirven para ver cómo funciona.</span><button class="btn-ghost" data-act="borrar-ejemplos">Borrar ejemplos</button></div>';
  }
  if (!pend.length){
    html += '<div class="vacio">'+ico("via")+'<h2>No hay trenes en marcha</h2><p>Pulsa «Tarea» o entra en School, Home o Social.</p></div>';
  } else {
    html += pend.map(function(t){ return tarjeta(t, now, true); }).join("");
  }
  return html;
}

function vistaArea(area, now){
  var A = AREAS[area];
  var aps = S.apartados.filter(function(a){ return a.area === area; }).sort(function(a,b){ return a.orden - b.orden; });
  var tiles = aps.map(function(a){
    var p = pendientesDe(a.id);
    var urg = p.reduce(function(m,t){ return Math.max(m, fase(t, now)); }, 0);
    var cuenta = urg ? '<span class="c" style="--fc:'+FASES[urg].c+'"><span class="mini-tren">'+tren(urg)+'</span>'+p.length+'</span>' : '<span class="c none">Sin tareas</span>';
    var total = S.tareas.filter(function(t){ return t.apartadoId === a.id; }).length;
    var conf = borrandoApartado === a.id
      ? '<div class="conf"><b>¿Borrar «'+esc(a.nombre)+'»?</b><span>'+total+(total===1?' tarea se borrará':' tareas se borrarán')+'</span><div class="mini"><button class="btn-danger" data-act="borrar-ap-si" data-id="'+a.id+'">Borrar</button><button class="btn-ghost" data-act="borrar-ap-no">No</button></div></div>' : '';
    var edit = editArea ? '<div class="edit"><button data-act="editar-ap" data-id="'+a.id+'">Cambiar</button><button data-act="borrar-ap" data-id="'+a.id+'">Borrar</button></div>' : '';
    return '<div class="tile'+(editArea?' editing':'')+'" style="--ac:'+A.c+'">' +
      (editArea ? '' : '<button class="abrir" data-act="abrir-ap" data-id="'+a.id+'" aria-label="Abrir '+esc(a.nombre)+'"></button>') +
      '<span class="disco">'+ico(a.icono)+'</span><span class="n">'+esc(a.nombre)+'</span>'+cuenta+edit+conf+'</div>';
  }).join("");
  tiles += '<button class="tile add" style="--ac:'+A.c+'" data-act="nuevo-ap">'+ico("mas")+'<span>Nuevo apartado</span></button>';
  return '<div class="grid">'+tiles+'</div>';
}

function vistaApartado(id, now){
  var a = apartado(id);
  if (!a) { V = {tipo:"inicio"}; return vistaInicio(now); }
  var A = AREAS[a.area];
  var pend = pendientesDe(id);
  var hechas = S.tareas.filter(function(t){ return t.apartadoId === id && t.completada; }).sort(function(x,y){ return y.completada - x.completada; });
  var html = '<button class="btn btn-main" style="--ac:'+A.c+'" data-act="nueva" data-id="'+id+'">'+ico("mas")+' Nueva tarea</button>';
  html += pend.length ? pend.map(function(t){ return tarjeta(t, now, false); }).join("") : '<div class="vacio">'+ico("checkc")+'<h2>Nada pendiente aquí</h2></div>';
  var recs = S.recurrentes.filter(function(r){ return r.apartadoId === id; });
  html += '<section class="panel sec rep"><h2>'+ico("calendario")+' Se repite</h2>' + recs.map(function(r){
      var c = proximaCita(r);
      var acciones = borrandoRec === r.id
        ? '<button class="btn-danger" data-act="rec-borrar-si" data-id="'+r.id+'">Sí, quitar</button><button class="btn-ghost" data-act="rec-borrar-no">No</button>'
        : (standalone ? '<button class="btn-ghost" data-act="rec-ics" data-id="'+r.id+'">'+ico("campana")+' Avisos al calendario</button>' : '') + '<button class="btn-ghost" data-act="rec-borrar" data-id="'+r.id+'">Quitar</button>';
      return '<div class="rec"><b>'+esc(r.titulo)+'</b><span>'+textoRepite(r)+'</span><span class="prox">Próxima: '+fmtDia.format(c)+'</span><div class="mini">'+acciones+'</div></div>';
    }).join("") + '<button class="btn btn-ghost" data-act="rec-nueva" data-id="'+id+'">'+ico("mas")+' Añadir algo que se repite</button></section>';
  if (hechas.length){
    html += '<details class="hechas"><summary>Terminadas ('+hechas.length+')</summary>' +

function dosDig(n){ return (n<10?"0":"") + n; }
function claveDia(d){ return d.getFullYear()+"-"+dosDig(d.getMonth()+1)+"-"+dosDig(d.getDate()); }
function abrirNueva(apId, desdeInicio){

function limiteDe(o){
  var p = o.dia.split("-").map(Number), h = o.hora.split(":").map(Number);

function calHTML(o, t, maxMs){
  var first = new Date(o.y, o.m, 1), off = (first.getDay()+6)%7, dias = new Date(o.y, o.m+1, 0).getDate();
  var hoy = new Date(); hoy.setHours(0,0,0,0);
  var tope = maxMs ? new Date(maxMs) : null; if (tope) tope.setHours(0,0,0,0);
  var esMesActual = o.y === hoy.getFullYear() && o.m === hoy.getMonth();
  var esMesTope = tope && o.y === tope.getFullYear() && o.m === tope.getMonth();
  var g = ["L","M","X","J","V","S","D"].map(function(d){ return '<span class="dow">'+d+'</span>'; }).join("");

    g += '<button data-act="n-dia" data-t="'+t+'" data-id="'+k+'" '+(no?'disabled ':'')+'class="'+(k===o.dia?'sel ':'')+(dt.getTime()===hoy.getTime()?'hoy':'')+'" aria-label="'+fmtHoy.format(dt)+'">'+d+'</button>';
  }
  var horas = ["08:00","09:00","15:00","18:00","21:00"].map(function(h){ return '<button data-act="n-hora" data-t="'+t+'" data-id="'+h+'" class="'+(o.hora===h?'sel':'')+'">'+h+'</button>'; }).join("");
  return '<div class="cal"><div class="cal-h"><button class="icon-btn" data-act="n-mes" data-t="'+t+'" data-id="-1" '+(esMesActual?'disabled':'')+' aria-label="Mes anterior">‹</button><b>'+mesBonito(first)+'</b><button class="icon-btn" data-act="n-mes" data-t="'+t+'" data-id="1" '+(esMesTope?'disabled':'')+' aria-label="Mes siguiente">›</button></div><div class="cal-g">'+g+'</div></div>' +

// ---------- Avisos en el Calendario (.ics) ----------
function icsFecha(ms){ return new Date(ms).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,""); }
function icsTxt(s){ return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }
function bajarICS(eventos, nombre){
  var L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Tren de Tareas//ES","CALSCALE:GREGORIAN"].concat(eventos, ["END:VCALENDAR"]);
  try {
    var blob = new Blob([L.join("\r\n")], {type:"text/calendar"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  } catch(e){}
}
function descargarICS(t){
  var now = Date.now(), ev = [], inicio = t.creada;
  var hitos = parcialesDe(t).map(function(p){ return {lim:p.limite, nom:"Entrega parcial «"+p.titulo+"»", hecho:!!p.completada}; });
  hitos.push({lim:t.limite, nom:"Entrega final", hecho:false});
  hitos.forEach(function(h){
    if (!h.hecho){
      var total = h.lim - inicio;
      [[.25,2],[.5,3],[.75,4]].forEach(function(x){
        var ms = inicio + total*x[0];
        if (ms > now) ev.push({ms:ms, sum:FASES[x[1]].n+" · "+t.titulo+" ("+h.nom+")", desc:FASES[x[1]].m});
      });
      if (h.lim > now) ev.push({ms:h.lim, sum:h.nom+" · "+t.titulo, desc:"Hoy tiene que estar lista."});
    }
    inicio = h.lim;
  });
  var L = [];
  ev.forEach(function(e,i){
    L.push("BEGIN:VEVENT","UID:"+t.id+"-"+i+"@trendetareas","DTSTAMP:"+icsFecha(now),"DTSTART:"+icsFecha(e.ms),"DTEND:"+icsFecha(e.ms+15*60e3),
      "SUMMARY:"+icsTxt(e.sum),"DESCRIPTION:"+icsTxt(e.desc),"BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsTxt(e.sum),"TRIGGER:PT0M","END:VALARM","END:VEVENT");
  });
  bajarICS(L, "tren-de-tareas.ics");
}
// Cita que se repite: evento de día completo con repetición y aviso a las 9:00 de los días de antelación elegidos.
function descargarICSRec(r){
  var f = fechaLocal(r.primera), sig = new Date(f); sig.setDate(sig.getDate()+1);
  var d8 = function(x){ return x.getFullYear()+dosDig(x.getMonth()+1)+dosDig(x.getDate()); };
  var trig = r.aviso >= 1 ? "-P"+(r.aviso-1)+"DT15H" : "PT9H";
  bajarICS(["BEGIN:VEVENT","UID:"+r.id+"@trendetareas","DTSTAMP:"+icsFecha(Date.now()),"DTSTART;VALUE=DATE:"+d8(f),"DTEND;VALUE=DATE:"+d8(sig),
    "RRULE:FREQ=WEEKLY;INTERVAL="+r.cada,"SUMMARY:"+icsTxt(r.titulo),"DESCRIPTION:"+icsTxt(textoRepite(r)),
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsTxt(r.titulo+" · "+fmtSemana.format(f)),"TRIGGER:"+trig,"END:VALARM","END:VEVENT"], "cita-repetida.ics");
}

// ---------- Citas que se repiten ----------
function fechaLocal(k){ var p = k.split("-").map(Number); return new Date(p[0], p[1]-1, p[2]); }
function hoy0(){ var h = new Date(); h.setHours(0,0,0,0); return h; }
function proximaCita(r){
  var d = fechaLocal(r.primera), h = hoy0(), guard = 0;
  while (d < h && guard++ < 2000) d.setDate(d.getDate() + 7*r.cada);
  return d;
}
function diaAviso(r, cita){ var a = new Date(cita); a.setDate(a.getDate() - r.aviso); return a; }
function enAviso(r){ var c = proximaCita(r), h = hoy0(); return h >= diaAviso(r, c) && h <= c; }
function textoRepite(r){
  var f = fechaLocal(r.primera), dia = fmtSemana.format(f);
  var cada = r.cada === 1 ? "Cada semana" : r.cada === 2 ? "Un " + dia + " de cada dos" : "Cada " + r.cada + " semanas";
  var aviso = r.aviso === 0 ? "aviso el mismo día" : "aviso el " + fmtSemana.format(diaAviso(r, f)) + " antes";
  return cada + (r.cada === 2 ? "" : ", los " + dia + "s") + " · " + aviso;
}
function cuandoCita(c){
  var dias = Math.round((c - hoy0()) / D);
  return dias === 0 ? "Hoy" : dias === 1 ? "Mañana" : "El " + fmtDia.format(c);
}

// ---------- Acciones ----------
document.addEventListener("click", function(ev){
  var b = ev.target.closest("[data-act]"); if (!b) return;
  var act = b.getAttribute("data-act"), id = b.getAttribute("data-id"), dt = b.getAttribute("data-t");
  var objCal = N ? (dt === "p" ? N.p : N) : null;
  var r = id ? (S.recurrentes || []).find(function(x){ return x.id === id; }) : null;
  if ((act === "n-fondo" || act === "f-fondo" || act === "r-fondo") && ev.target !== b) return;
  var t = id ? S.tareas.find(function(x){ return x.id === id; }) : null;
  switch(act){
    case "tab": editArea = false; borrandoApartado = null; V = id === "inicio" ? {tipo:"inicio"} : {tipo:"area", area:id}; window.scrollTo(0,0); break;
    case "ajustes": V = {tipo:"ajustes", desde:V}; copiado = ""; restaurar = {txt:"", ok:"", confirm:false}; break;
    case "atras": V = V.tipo === "apartado" ? {tipo:"area", area:(apartado(V.apartadoId)||{}).area||"school"} : (V.desde || {tipo:"inicio"}); break;
    case "abrir-ap": V = {tipo:"apartado", apartadoId:id}; window.scrollTo(0,0); break;
    case "editar-area": editArea = !editArea; borrandoApartado = null; break;
    case "nuevo-ap": F = {id:null, area:V.area, nombre:"", icono:"pin"}; renderHoja(); return;
    case "editar-ap": var ea = apartado(id); F = {id:id, area:ea.area, nombre:ea.nombre, icono:ea.icono}; renderHoja(); return;
    case "borrar-ap": borrandoApartado = id; break;
    case "borrar-ap-no": borrandoApartado = null; break;
    case "borrar-ap-si": S.tareas = S.tareas.filter(function(x){ return x.apartadoId !== id; }); S.recurrentes = S.recurrentes.filter(function(x){ return x.apartadoId !== id; }); S.apartados = S.apartados.filter(function(x){ return x.id !== id; }); borrandoApartado = null; guardar(); break;
    case "f-icono": F.icono = id; renderHojaAp(); return;
    case "f-cerrar": case "f-fondo": F = null; renderHoja(); return;
    case "f-guardar":
      var nom = F.nombre.trim(); if (!nom) return;
      if (F.id){ var ap = apartado(F.id); ap.nombre = nom; ap.icono = F.icono; }
      else { var max = S.apartados.reduce(function(m,x){ return Math.max(m,x.orden); }, 0); S.apartados.push({id:uid(), area:F.area, nombre:nom, icono:F.icono, orden:max+1}); }
      F = null; guardar(); renderHoja(); break;
    case "nueva": var enAp = V.tipo === "apartado" ? V.apartadoId : null; abrirNueva(id || enAp, !id && !enAp); return;
    case "n-ap": N.apartadoId = id; N.paso = 1; renderHoja(); return;
    case "n-sig": if (!N.titulo.trim()) return; N.paso = 2; renderHoja(); return;
    case "n-atras":
      if (N.paso === 3 && N.p){ N.p = null; if (!N.parciales.length) N.conParciales = false; }
      else if (N.paso === 3 && N.conParciales){ N.conParciales = false; N.parciales = []; }
      else N.paso = N.paso - 1;
      renderHoja(); return;
    case "n-sig2": if (limiteN() <= Date.now() + 60e3) return; N.paso = 3; N.parciales = N.parciales.filter(function(p){ return p.limite < limiteN(); }); N.conParciales = N.parciales.length > 0; renderHoja(); return;
    case "n-conp": N.conParciales = true; nuevaParcial(); renderHoja(); return;
    case "n-pnew": nuevaParcial(); renderHoja(); return;
    case "n-padd":
      var lp = limiteDe(N.p); if (lp <= Date.now() + 60e3 || lp >= limiteN()) return;
      N.parciales.push({titulo:N.p.titulo.trim() || "Entrega parcial "+(N.parciales.length+1), limite:lp});
      N.parciales.sort(function(x,y){ return x.limite - y.limite; }); N.p = null; renderHoja(); return;
    case "n-pdel": N.parciales.splice(Number(id), 1); renderHoja(); return;
    case "rec-nueva": R = {apartadoId:id, titulo:"", primera:claveDia(new Date(Date.now()+D)), cada:2, aviso:3}; renderHoja(); return;
    case "r-cerrar": case "r-fondo": R = null; renderHoja(); return;
    case "r-guardar":
      if (!R.titulo.trim() || !R.primera) return;
      S.recurrentes.push({id:uid(), apartadoId:R.apartadoId, titulo:R.titulo.trim(), primera:R.primera, cada:R.cada, aviso:R.aviso});
      R = null; guardar(); renderHoja(); break;
    case "rec-ics": if (r) descargarICSRec(r); return;
    case "rec-borrar": borrandoRec = id; break;
    case "rec-borrar-no": borrandoRec = null; break;
    case "rec-borrar-si": S.recurrentes = S.recurrentes.filter(function(x){ return x.id !== id; }); borrandoRec = null; guardar(); break;
    case "n-cerrar": case "n-fondo": N = null; renderHoja(); return;
    case "n-mes": var nm = new Date(objCal.y, objCal.m + Number(id), 1); objCal.y = nm.getFullYear(); objCal.m = nm.getMonth(); renderHoja(); return;
    case "n-dia": objCal.dia = id; renderHoja(); return;
    case "n-hora": objCal.hora = id; renderHoja(); return;
    case "n-guardar":
      var lim = limiteN(); if (lim <= Date.now() + 60e3) return;
      var nt = {id:uid(), apartadoId:N.apartadoId, titulo:N.titulo.trim(), creada:Date.now(), limite:lim, completada:null,
        parciales:(N.conParciales ? N.parciales : []).filter(function(p){ return p.limite < lim; }).map(function(p){ return {id:uid(), titulo:p.titulo, limite:p.limite, completada:null}; })};
      S.tareas.push(nt); S.vistos[nt.id] = 1; N = null; guardar(); renderHoja(); break;
    case "acabado": confirmandoHecho = id; borrandoTarea = null; break;
    case "hecho-no": confirmandoHecho = null; break;
    case "hecho":
      if (!t) return;
      var oh = objetivo(t), ahora = Date.now(); confirmandoHecho = null; borrandoTarea = null;
      if (oh.parcial){ oh.parcial.completada = ahora; S.vistos[t.id] = fase(t, ahora); guardar(); if (ahora <= oh.parcial.limite) fiesta(t, oh.parcial); }
      else { t.completada = ahora; guardar(); if (aTiempo(t)) fiesta(t); }
      break;
    case "parcial-deshacer":
      if (t){ var pp = (t.parciales||[]).find(function(x){ return x.id === b.getAttribute("data-p"); }); if (pp){ pp.completada = null; S.vistos[t.id] = fase(t); guardar(); } }
      break;
    case "fiesta-ok": document.getElementById("fiesta").innerHTML = ""; return;
    case "deshacer": if (t){ t.completada = null; guardar(); } break;
    case "borrar-tarea": borrandoTarea = id; break;
    case "borrar-tarea-no": borrandoTarea = null; break;
    case "borrar-tarea-si": S.tareas = S.tareas.filter(function(x){ return x.id !== id; }); delete S.vistos[id]; borrandoTarea = null; guardar(); break;
    case "ics": if (t) descargarICS(t); return;
    case "vistos": var now = Date.now(); S.tareas.forEach(function(x){ if (!x.completada) S.vistos[x.id] = fase(x, now); }); guardar(); break;
    case "borrar-ejemplos": S.tareas.filter(function(x){ return x.ejemplo; }).forEach(function(x){ delete S.vistos[x.id]; }); S.tareas = S.tareas.filter(function(x){ return !x.ejemplo; }); guardar(); break;
    case "copiar":
      var txt = JSON.stringify(S);
      var fallo = function(){ restaurar.txt = txt; copiado = "Selecciona y copia el texto del cuadro de abajo."; render(); };
      try { navigator.clipboard.writeText(txt).then(function(){ copiado = "Copiada. Pégala en Notas o en un correo para guardarla."; render(); }, fallo); } catch(e){ fallo(); }
      return;
    case "restaurar": restaurar.txt = document.getElementById("restaurar").value; restaurar.ok = ""; restaurar.confirm = !!restaurar.txt.trim(); break;
    case "restaurar-no": restaurar.confirm = false; break;
    case "restaurar-si":
      try { var d = JSON.parse(restaurar.txt); if (!Array.isArray(d.apartados) || !Array.isArray(d.tareas)) throw 0;
        S = normalizar(d); guardar(); restaurar = {txt:"", ok:"Copia restaurada.", confirm:false};
      } catch(e){ restaurar.confirm = false; restaurar.ok = "Ese texto no es una copia válida. Copia el texto completo, desde la primera llave hasta la última."; }
      break;
    default: return;
  }
  render();
});
document.addEventListener("change", function(ev){
  if (R && ev.target.id === "r-primera"){ R.primera = ev.target.value; renderHoja(); return; }
  if (R && ev.target.id === "r-cada"){ R.cada = Number(ev.target.value); renderHoja(); return; }
  if (R && ev.target.id === "r-aviso"){ R.aviso = Number(ev.target.value); renderHoja(); return; }
  if (ev.target.id === "dias"){ S.diasPremio = Number(ev.target.value) || 3; guardar(); }
  if (ev.target.id === "restaurar"){ restaurar.txt = ev.target.value; }
});
document.addEventListener("keydown", function(ev){
  if (ev.key === "Escape"){ if (document.getElementById("fiesta").innerHTML){ document.getElementById("fiesta").innerHTML = ""; } else if (N || F){ N = null; F = null; renderHoja(); } }
});
document.addEventListener("visibilitychange", function(){ if (!document.hidden) render(); });
setInterval(render, 60e3);
render();

if (standalone && "serviceWorker" in navigator && location.protocol === "https:"){
  try { navigator.serviceWorker.register("sw.js").catch(function(){}); } catch(e){}
}
})();
